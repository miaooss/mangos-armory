services:
    init-data:
        image: alpine:3
        volumes:
            - ./data:/data/
            - ./scripts/init-data.sh:/init-data.sh:ro
        environment:
            INIT_DATA_RELEASE_URL: https://github.com/r-o-b-o-t-o/azerothcore-armory/releases/download/v1.0.0/data.tar.gz
            INIT_DATA_GITHUB_API: https://api.github.com/repos/r-o-b-o-t-o/azerothcore-armory/contents/data
            INIT_DATA_RAW_BASE: https://raw.githubusercontent.com/r-o-b-o-t-o/azerothcore-armory/master/data
        command: sh /init-data.sh

    armory:
        restart: unless-stopped
        image: ghcr.io/miaooss/mangos-armory:latest 
        volumes:
            - ./data:/data/
            - ./logs:/logs/
        env_file:
            - .env
        networks:
            - local-private-net
        ports:
            - 48733:48733
        depends_on:
            init-data:
                condition: service_completed_successfully

networks:
    local-private-net:
        driver: bridge
    ac-network:
        name: ${DOCKER_AC_NETWORK_NAME:-azerothcore-wotlk_ac-network} # default network name if you use the docker setup of ac
        external: ${DOCKER_AC_NETWORK_EXTERNAL:-false}
